<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">MoneyMiner — Mission Control for paid software work discovery</title>
  <desc id="desc">Dark teal banner with MoneyMiner brand, tagline about human-approved paid work discovery, and a subtle network motif. Conceptual brand art — not a live product screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1620"/>
      <stop offset="55%" stop-color="#0f2a2a"/>
      <stop offset="100%" stop-color="#14322c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#5b9dff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a3a36" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <!-- network nodes -->
  <g stroke="#3ddc97" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M980 90 L1120 160 L1280 120 L1410 200"/>
    <path d="M1020 280 L1180 220 L1340 300 L1480 250"/>
    <path d="M1100 140 L1180 220 L1280 120"/>
  </g>
  <g fill="#3ddc97">
    <circle cx="980" cy="90" r="5" opacity="0.7"/><circle cx="1120" cy="160" r="6" opacity="0.85"/>
    <circle cx="1280" cy="120" r="5" opacity="0.7"/><circle cx="1410" cy="200" r="7" opacity="0.9"/>
    <circle cx="1020" cy="280" r="5" opacity="0.6"/><circle cx="1180" cy="220" r="6" opacity="0.8"/>
    <circle cx="1340" cy="300" r="5" opacity="0.7"/><circle cx="1480" cy="250" r="6" opacity="0.85"/>
  </g>
  <text x="72" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#e8f2ee" letter-spacing="-1">MoneyMiner</text>
  <rect x="72" y="172" width="120" height="4" fill="url(#accent)" rx="2"/>
  <text x="72" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#a8c4ba">Find funded software work. Verify payouts. Prepare solutions. Human approval before anything leaves the machine.</text>
  <text x="72" y="290" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#6a9a88">PUBLIC SHOWCASE · presentation only · verified earnings: $0</text>
  <text x="72" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5a7a70">Conceptual brand banner — not a live dashboard screenshot</text>
</svg>
