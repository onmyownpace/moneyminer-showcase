<text x="274" y="152" font-family="Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#5b9dff">2  Validate</text>
<text x="274" y="180" font-family="Segoe UI,sans-serif" font-size="13" fill="#c8ddd4">Funding · competition · payout</text>
<text x="274" y="216" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8aada0">Verifier · Comp Analyst · Terms</text>
