<text x="954" y="216" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8aada0">Coding Prep · Proposal Agent</text>
<rect x="1160" y="120" width="200" height="130" rx="12" fill="#2a1438" stroke="#c79bff" stroke-width="1.5"/>
<text x="1174" y="152" font-family="Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#c79bff">6  Tracking</text>
<text x="1174" y="180" font-family="Segoe UI,sans-serif" font-size="13" fill="#c8ddd4">Claims · invoices · receipts</text>
<text x="1174" y="216" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8aada0">Payment Tracker · Reply Monitor</text>
