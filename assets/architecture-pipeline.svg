  <rect x="40" y="290" width="1320" height="120" rx="12" fill="#0e1c22" stroke="#2a4a44" stroke-width="1"/>
  <text x="60" y="328" font-family="Georgia, serif" font-size="20" fill="#e8f2ee">Logical roles ≠ independently running AI models</text>
  <text x="60" y="360" font-family="Segoe UI,sans-serif" font-size="14" fill="#a8c4ba">MoneyMiner defines ~17 logical agent roles (Orchestrator, hunters, verifiers, proposal &amp; payment specialists, etc.).</text>
  <text x="60" y="386" font-family="Segoe UI,sans-serif" font-size="14" fill="#a8c4ba">They log activity inside one local Mission Control process and share ThreadPool workers — they are not 17 separate cloud AIs.</text>

