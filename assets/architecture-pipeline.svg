<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="t d">
  <title id="t">MoneyMiner pipeline: discovery through tracking</title>
  <desc id="d">Conceptual architecture diagram showing discovery to tracking. Distinguishes 17 logical agent roles from independently running AI models. Clearly labeled conceptual — not a live Mission Control screenshot.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1418"/><stop offset="100%" stop-color="#122028"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ddc97"/>
    </marker>
  </defs>
  <rect width="1400" height="780" fill="url(#bg2)"/>
  <text x="40" y="48" font-family="Georgia, serif" font-size="30" fill="#e8f2ee">Architecture: discovery → tracking</text>
  <text x="40" y="78" font-family="Segoe UI, Helvetica, sans-serif" font-size="15" fill="#8aada0">Conceptual diagram (not a live screenshot). Pipeline gates keep spending and submissions human-approved.</text>

