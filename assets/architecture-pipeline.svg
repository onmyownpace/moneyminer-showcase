<text x="514" y="180" font-family="Segoe UI,sans-serif" font-size="13" fill="#c8ddd4">Score & first-dollar rank</text>
<text x="514" y="216" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8aada0">Evaluator · Ranker · Prioritizer</text>
<rect x="720" y="120" width="190" height="130" rx="12" fill="#3a2414" stroke="#e08a5a" stroke-width="1.5"/>
<text x="734" y="152" font-family="Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e08a5a">4  Human GO</text>
<text x="734" y="180" font-family="Segoe UI,sans-serif" font-size="13" fill="#c8ddd4">Operator approval gate</text>
<text x="734" y="216" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8aada0">No auto-spend / submit</text>
